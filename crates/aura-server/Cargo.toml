[package]
name = "aura-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
aura-protocol = { path = "../aura-protocol" }
tokio = { version = "1.51.1", features = ["full", "macros"] }
# aws-lc-rs instead of the default ring: one crypto library for the whole
# server, and the one that implements X25519MLKEM768 (see src/tls.rs).
quinn = { version = "0.11.9", default-features = false, features = ["log", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
dashmap = "6.1.0"
thiserror = "2.0.18"
anyhow = "1.0.102"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
aura-identity = { path = "../aura-identity" }
aura-telemetry = { path = "../aura-telemetry" }
futures = "0.3.31"
tokio-stream = { version = "0.1.18", features = ["net"] }
rustls = { version = "0.23.37", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-acme = { version = "0.15.4", features = ["tokio", "axum"] }
axum = "0.8.9"
rustls-pki-types = { version = "1.14.1", features = ["std"] }
prost = "0.14.3"
bytes = "1.11"
rcgen = { version = "0.14.7", default-features = false, features = ["aws_lc_rs"] }

# Configuration
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
toml = "1.1.2"

# Database
rusqlite = { version = "0.41.1", features = ["bundled"] }

# Authentication
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.1"

hex = "0.4.3"
uuid = { version = "1.23.0", features = ["v4"] }

# Rate limiting (per-IP handshake throttle)
governor = "0.10.4"
nonzero_ext = "0.3.0"

[dev-dependencies]
# Client side of the end-to-end tests (tests/e2e_tests.rs): the same MLS, text
# and audio code the desktop and macOS clients link.
aura-core = { path = "../aura-core", default-features = false }
aura-telemetry = { path = "../aura-telemetry", features = ["testing"] }
