syntax = "proto3";

// Follows Uber Protobuf Style Guide V2
package aura.v1alpha1;

// ============================================================================
// API Versioning - All messages wrapped in Envelope for forward compatibility
// ============================================================================

// MLS envelope for all MLS-related signaling
message MlsEnvelope {
    uint32 sender_id = 1;      // Session ID of the sender
    string channel_id = 2;     // Target channel
    MlsGroupType group_type = 3;
    uint64 epoch = 4;
    
    // Metadata for member management
    uint32 target_session_id = 5; 
    string target_uuid = 6;

    oneof content {
        bytes key_package = 10;   // Initial KeyPackage for joining
        bytes welcome = 11;       // MLS Welcome for new members
        bytes proposal = 12;      // MLS Proposal (Add, Remove, Update)
        bytes commit = 13;        // MLS Commit (epoch advancement)
        bool create_group = 14;   // Trigger for group creation
        MlsCommitWelcome commit_welcome = 15; 
    }
}

message MlsCommitWelcome {
    bytes commit = 1;
    bytes welcome = 2;
    uint32 new_member_session_id = 3;
}

// Server -> group founder (MSG_MLS_SYNC_MEMBERS, 0x58): the account ids that
// should still be in a channel's MLS group. Sent after a member leaves the
// channel or disconnects. The founder commits a Remove for every leaf whose
// verified identity is not listed and returns that commit as
// MSG_MLS_RATCHET_COMMIT (0x57); if nothing needs removing it sends nothing.
// It can only ever shrink a group, never grow it.
message MlsSyncMembers {
    string channel_id = 1;
    MlsGroupType group_type = 2;
    repeated string member_uuids = 3;
}

// The user's position in 3D space.
message Position {
    float x = 1;
    float y = 2;
    float z = 3;
}

// The cleartext header visible to the server.
message Header {
    uint32 user_id = 1;
    uint64 sequence = 2;
    Position position = 3;
}

// The opaque payload containing encrypted audio.
message AudioPacket {
    Header header = 1;
    bytes ciphertext = 2;
}

enum UserMode {
    USER_MODE_INVALID = 0;
    USER_MODE_SPEAKER = 1;
    USER_MODE_LISTENER = 2;
}

enum ChannelType {
    CHANNEL_TYPE_REGULAR = 0;
    CHANNEL_TYPE_LOBBY = 1;
}

// ============================================================================
// Dual MLS Group Architecture
// Voice and Text are separate to prevent epoch churn interference.
// ============================================================================

// MLS Group Types
// VOICE: Low churn - epoch advances only on join/leave/hourly PFS ratchet
// TEXT:  High churn - epoch can advance per message batch
enum MlsGroupType {
    MLS_GROUP_TYPE_INVALID = 0;
    MLS_GROUP_TYPE_VOICE = 1;
    MLS_GROUP_TYPE_TEXT = 2;
}

// Information about an MLS group (Voice or Text channel)
message MlsGroupInfo {
    string group_id = 1;
    MlsGroupType group_type = 2;
    uint64 current_epoch = 3;
}

// Request to join both Voice and Text groups for a channel
message JoinChannelGroups {
    string channel_id = 1;
    UserMode mode = 2;
}

// Response with both group welcomes and full server state
message ChannelGroupsWelcome {
    string channel_id = 1;
    bytes voice_welcome = 2;  // MLS Welcome for voice group
    bytes text_welcome = 3;   // MLS Welcome for text group
    ServerState server_state = 4; // Snapshot of all channels and users
}

// Full snapshot of server state
message ServerState {
    repeated ChannelInfo channels = 1;
    repeated UserProfile profiles = 2; // Active users' profiles
}

// Information about a channel
message ChannelInfo {
    string channel_id = 1;
    string name = 2;
    string comment = 3;        // Supports Markdown
    ChannelIcon icon = 4;
    int32 position = 5;        // For custom ordering
    repeated uint32 user_ids = 6; // Active users in this channel (deprecated)
    repeated ChannelUserStatus users = 7; // Active users with status
    ChannelType type = 8;
}

message ChannelUserStatus {
    uint32 session_id = 1;
    bool is_muted = 2;
    bool is_deafened = 3;
    string display_name = 4;
    // Stable per-user identifier (UUID). Added so clients can key
    // local-only state (volume / mute / known-users list) against
    // something that survives reconnects — ephemeral session_ids
    // do not.
    string user_uuid = 5;
}

// Channel icon options
message ChannelIcon {
    oneof icon {
        string emoji = 1;      // Single emoji string
        string preset_id = 2;  // e.g. "controller", "music"
        bytes custom_data = 3; // Base64 or raw bytes (limit: 128KB)
    }
}

// ============================================================================
// Profile Metadata - Signed but Plaintext
// Server can index/search profiles, but cannot forge them.
// ============================================================================

// User profile - signed but intentionally plaintext for server searchability
message UserProfile {
    string user_id = 1;
    string display_name = 2;  // Server-authoritative: ignored in UpdateProfile; ProfileUpdated always carries the account's name
    string bio = 3;           // Supports Markdown (limit: 16 KiB of UTF-8)
    bytes avatar_data = 4;    // Raw PNG or JPEG bytes, or empty for none (limit: 128 KiB)
    bytes signature = 5;      // Ed25519 signature over serialized fields 1-4
    bytes signing_key = 6;    // User's Ed25519 public key for verification
}

// Request to update own profile
message UpdateProfile {
    UserProfile profile = 1;
}

// Request to fetch a user's profile
message GetProfile {
    string user_uuid = 1;
}

// ============================================================================
// Authentication - TOFU (Trust On First Use) with a hybrid identity
// ============================================================================
//
// The server opens with [0x02][32-byte challenge]. The client answers with
// [0x03][u32 LE length][AuthRequest]; the server replies with
// [0x04][u32 LE length][AuthResponse].

// Authentication request from client
message AuthRequest {
    bytes identity_public_key = 1;  // 1,984 bytes: ML-DSA-65 key || Ed25519 key
    string display_name = 2;        // Desired username (TOFU - first come first served)
    bytes signature = 3;            // 3,373-byte hybrid signature over the auth transcript
                                    // (aura_identity::auth_transcript, Purpose::Auth)
    optional string server_password = 4;  // If server requires password
    bytes challenge = 5;            // The 32-byte challenge that was signed
    optional string client_version = 6;   // Client application version (e.g. "0.2.0")
    optional uint32 protocol_version = 7; // Client protocol version for negotiation
}

// Authentication response from server
message AuthResponse {
    bool success = 1;
    uint32 session_id = 2;          // Session ID for datagrams and presence
    string session_token = 3;
    bool verified = 4;              // Whether user is admin-verified
    string error_message = 5;       // Error reason: "username_taken", "invalid_password", etc.
    string user_uuid = 6;           // The account's server-assigned id (U_...); the user id
                                    // clients put in their MLS credential
    bool is_admin = 7;
    optional string server_version = 8;   // Server application version
    optional uint32 protocol_version = 9; // Negotiated/supported server protocol version
}

// Challenge request - client asks server for a random challenge to sign
message ChallengeRequest {
    bytes ed25519_public_key = 1;   // Client's public key
}

// Challenge response - server provides challenge bytes
message ChallengeResponse {
    bytes challenge = 1;            // Random 32 bytes to sign
}

// ============================================================================
// Admin Operations
// ============================================================================
//
// Sent on the control stream once logged in (message types 0x48-0x4C; see
// docs/protocol/control_stream.md). The server authorises each request with
// the identity the connection logged in as and the admin permissions that
// account holds right now. The `session_token` fields are left over from an
// earlier design and are ignored.

// Request to verify a user (needs verify_users)
message VerifyUserRequest {
    string session_token = 1;       // Ignored
    string target_user_uuid = 2;      // User to verify
}

// Request to ban/unban a user (needs ban_users). A ban drops the user's live
// connections and refuses their logins until they are unbanned.
message BanUserRequest {
    string session_token = 1;       // Ignored
    string target_user_uuid = 2;      // User to ban/unban
    bool banned = 3;                // true = ban, false = unban
    string reason = 4;              // Reason for ban (logged by the server)
}

// Request to set a user's admin permissions (needs grant_admin). The
// permissions replace whatever the user held; granting none revokes admin.
message GrantAdminRequest {
    string session_token = 1;       // Ignored
    string target_user_uuid = 2;      // User to promote
    bool verify_users = 3;          // Permission to verify users
    bool ban_users = 4;             // Permission to ban, unban and kick users
    bool grant_admin = 5;           // Permission to grant admin to others
    bool manage_channels = 6;       // Permission to create, edit and delete channels
}

// Request to move a user out of the channel they are in (needs ban_users).
// Each of the user's sessions in a channel other than the lobby is taken out
// of it and told so with a ChannelDeleted notice (reason KICKED) naming the
// lobby as the fallback. Unlike a ban, the user can come back.
message KickUserRequest {
    string target_user_uuid = 1;
    string reason = 2;              // Shown to the kicked user
}

// Request to server-mute/unmute a live session (needs ban_users).
message ServerMuteRequest {
    uint32 target_session_id = 1;
    bool muted = 2;
}

// Generic admin operation response
message AdminResponse {
    bool success = 1;
    string error_message = 2;
}

// List users request (any admin)
message ListUsersRequest {
    string session_token = 1;       // Ignored
    uint32 offset = 2;
    uint32 limit = 3;               // 0 means the server default (100); capped at 500
}

// User presence status
enum PresenceStatus {
    PRESENCE_ONLINE = 0;
    PRESENCE_IDLE = 1;
    PRESENCE_DND = 2;
}

// User info in list response
message UserInfo {
    string user_uuid = 1;
    string display_name = 2;
    bool verified = 3;
    bool banned = 4;
    bool is_admin = 5;
    int64 created_at = 6;
    optional PresenceStatus presence = 7;
    optional string custom_status = 8;
    bool is_server_muted = 9;
}

// List users response
message ListUsersResponse {
    repeated UserInfo users = 1;
    uint32 total_count = 2;
    bool success = 3;               // false when the request was refused
    string error_message = 4;
}

// ============================================================================
// Text Messaging - IRC-Style (No Server Storage)
// Messages are broadcast only to online channel members.
// ============================================================================

// Plaintext text message (inside the encrypted payload)
enum MediaType {
    TEXT = 0;
    IMAGE = 1;
    FILE = 2;
}

message TextMessage {
    string sender_uuid = 1;      // Sender's UUID
    uint64 timestamp = 2;        // Unix timestamp (milliseconds)
    string content = 3;          // Message content (plaintext after decryption)
    string reply_to_id = 4;      // Optional: message ID being replied to
    string message_id = 5;       // UUID for this message (for replies)
    MediaType type = 6;          // Type of message (text, image, etc.)
    
    // Attachment metadata (for IMAGE and FILE types)
    uint64 file_size = 7;        // Size in bytes
    string sha256_hash = 8;      // Optional checksum

    // End-to-end encrypted file attachment manifest. Present when the bytes
    // travel as a file transfer (docs/protocol/file_transfer.md). Lives inside
    // the encrypted payload, so the server never sees the key or the metadata.
    // Fields 7/8 above are unused for transfers; `content` is a caption.
    FileManifest attachment = 9;
}

// Describes one encrypted file transfer. Carried inside an encrypted TextMessage.
// All string fields are sender-controlled and MUST be treated as untrusted.
message FileManifest {
    bytes file_id = 1;           // 16 random bytes; names the transfer stream and binds chunk AAD
    bytes file_key = 2;          // 32 random bytes; XChaCha20-Poly1305 key for every chunk
    string file_name = 3;        // Untrusted display name
    string mime_type = 4;        // Untrusted MIME type
    uint64 size = 5;             // Plaintext size in bytes
    uint32 chunk_size = 6;       // Plaintext bytes per chunk (65536 in version 1)
    uint32 chunk_count = 7;      // max(1, ceil(size / chunk_size))
    bytes sha256 = 8;            // SHA-256 of the whole plaintext (32 bytes)
}

// Encrypted text packet sent over wire
// Server routes this without decrypting - zero knowledge
message EncryptedTextPacket {
    uint32 sender_session_id = 1;  // Session ID for routing
    string channel_id = 2;         // Target channel
    uint64 epoch = 3;              // MLS epoch for key selection
    string message_id = 4;         // Client-generated UUID
    bytes ciphertext = 5;          // Encrypted TextMessage (XChaCha20-Poly1305)
    bytes nonce = 6;               // XChaCha20 nonce (24 bytes)
    bytes tag = 7;                 // Poly1305 tag (16 bytes)
    string reply_to_id = 8;        // Optional: message ID being replied to (plaintext for now)
}

// ============================================================================
// Channel & Profile Management
// ============================================================================

// Request to create a new channel (Admin only)
message CreateChannelRequest {
    string name = 1;
    string comment = 2;
    ChannelIcon icon = 3;
}

// Response for channel creation
message CreateChannelResponse {
    bool success = 1;
    string channel_id = 2;
    string error_message = 3;
}

// Request to update channel metadata (Admin only)
message UpdateChannelRequest {
    string channel_id = 1;
    optional string name = 2;
    optional string comment = 3;
    optional ChannelIcon icon = 4;
    optional int32 position = 5;
}

// Generic metadata update response
message MetadataUpdateResponse {
    bool success = 1;
    string error_message = 2;
}

// Request to delete a channel (Admin only)
message DeleteChannelRequest {
    string channel_id = 1;
}

// Why the server took a client out of a channel (see ChannelDeleted).
enum ChannelRemovalReason {
    // The channel was deleted. Zero, so a notice from a server that predates
    // this field reads as a deletion.
    CHANNEL_REMOVAL_REASON_DELETED = 0;
    // The client asked to join a channel that doesn't exist (deleted while it
    // was away, say). The server took it out of its previous channel, as for
    // any join, and it is now in no channel.
    CHANNEL_REMOVAL_REASON_NOT_FOUND = 1;
    // An admin kicked the client out of the channel. The channel still exists.
    CHANNEL_REMOVAL_REASON_KICKED = 2;
}

// Server → client notification that the recipient is no longer in a channel
// and should move to `fallback_channel_id`. Sent when the channel was deleted
// (only to its occupants; everyone else learns about the removal from the
// ServerState snapshot that follows), when the client tried to join a channel
// that doesn't exist, and when an admin kicked the client. Clients that
// predate `reason` treat every notice as a deletion, which still moves them
// to the fallback.
message ChannelDeleted {
    string channel_id = 1;
    // Channel the client should fall back to (the lobby, when one exists).
    // Empty if the server has no suggestion, in which case the client picks.
    string fallback_channel_id = 2;
    ChannelRemovalReason reason = 3;
    // The admin's reason, for a kick. Display text.
    string detail = 4;
}

// Request to delete a user/profile
message DeleteUserRequest {
    string user_uuid = 1;
}

// User status update (mute/deafen/presence)
message UserStatusUpdate {
    uint32 session_id = 1;
    bool is_muted = 2;
    bool is_deafened = 3;
    optional PresenceStatus presence = 4;
    optional string custom_status = 5;
    // Set by the server only: a moderator has muted this user. The server
    // ignores it on updates a client sends.
    optional bool is_server_muted = 6;
}

// User visibility updates (replaces manual MSG_USER_JOINED/MSG_USER_LEFT)
message UserJoined {
    string channel_id = 1;
    uint32 session_id = 2;
    string display_name = 3;
    // Stable per-user UUID so clients can map this ephemeral session
    // back to a known user across reconnects.
    string user_uuid = 4;
}

message UserLeft {
    string channel_id = 1;
    uint32 session_id = 2;
}

// Simple request to join a channel (replaces manual MSG_JOIN_CHANNEL)
message JoinChannelRequest {
    string channel_id = 1;
}
