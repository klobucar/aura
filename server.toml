# Aura Server Configuration
# This file can be customized or will use defaults if missing

[server]
bind_address = "0.0.0.0:8443"
max_connections = 1000
log_level = "info"

# Optional: Require this password to connect to the server
# Leave commented out for an open server
# password = "your-secret-here"

# Optional: Static TLS certificate and private key (PEM format)
# cert_path = "certs/server.crt"
# key_path = "certs/server.key"

# Optional: Automated Let's Encrypt (ACME) TLS certificates
# acme_domain = "voice.example.com"
# acme_contact = "admin@example.com"
# acme_cache_path = "data/acme"
# acme_directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
# acme_bind_port = 443
# http_bind_ip = "0.0.0.0"

# Optional: Prometheus metrics endpoint (GET /metrics)
# metrics_address = "[::]:9091"

# Optional: Per-IP QUIC handshake rate limiting
# handshake_per_minute = 60
# handshake_burst = 20

# Optional: Probe for a path MTU above 1200 bytes (default: true). Turn off
# if clients hang right after connecting on your network.
# mtu_discovery = false

[database]
path = "aura.db"

[verification]
# Verification mode determines who can join voice channels:
# - "none"     = No verification required (anyone can join)
# - "optional" = Users can be verified by admins (cosmetic badge only)
# - "required" = Only verified users can join voice channels
mode = "optional"
