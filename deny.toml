# cargo-deny configuration. Run with `cargo deny check`.
#
# License checking is intentionally not enabled here yet — enable once the
# transitive license set has been enumerated and a NOTICE file generated
# (e.g. via `cargo about generate`). The CI workflow runs only the
# `advisories bans sources` subcommands until then.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# Blocked on the upstream OpenMLS dependency chain: openmls 0.9.2 /
# openmls_rust_crypto 0.6.0 / openmls_basic_credential 0.6.0 are the latest
# releases and the fix is not reachable from our manifests. Re-check on every
# openmls bump, and whenever `mls::CIPHERSUITE` changes — the justification
# below depends on which primitives the suite uses.
ignore = [
    # crypto-bigint 0.5 has secret-dependent branches in arithmetic meant to be
    # constant-time. Only NIST-curve code reaches it (p256/p384/k256 via
    # elliptic-curve 0.13, from openmls_basic_credential and the RustCrypto
    # HPKE backend). Aura's suite, MLS_128_MLKEM768X25519_AES256GCM_SHA384_Ed25519,
    # uses X25519 + ML-KEM-768 (X-Wing) and Ed25519, so no secret ever passes
    # through those curves. The fix only exists on the crypto-bigint 0.7 line.
    { id = "RUSTSEC-2026-0387", reason = "only NIST-curve code uses it; our MLS suite is X-Wing + Ed25519, no P-256/P-384/k256 secrets" },
]

[bans]
multiple-versions = "allow"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
