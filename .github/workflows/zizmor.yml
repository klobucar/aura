name: zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  schedule:
    # Mondays 06:23 UTC — staggered against the Security audit workflow.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor (workflow security analysis)
    runs-on: ubuntu-latest
    permissions:
      # Read repo contents; write SARIF results to Code Scanning;
      # actions:read lets zizmor run online audits that need workflow metadata.
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Scan only our own workflows. The default `.` walks the repo and
          # picks up vendored workflows under crates/opus16-sys/vendor/opus/
          # that we don't author and can't fix here.
          inputs: .github/workflows/
