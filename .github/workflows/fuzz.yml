name: Fuzz

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Mondays 04:41 UTC, staggered against the other scheduled workflows.
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds to fuzz each target'
        required: false
        default: '60'
        type: string

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned: plain `nightly` moves daily and has shipped compiler crashes under
  # -Zsanitizer=address. Bump deliberately.
  FUZZ_TOOLCHAIN: nightly-2026-09-01
  CARGO_FUZZ_VERSION: 0.13.1
  # Opus 1.6.x DNN weight tarball checksum. Must match vendor/opus/autogen.sh.
  # Bump together with ci.yml when the vendored opus is updated.
  OPUS_MODEL_CHECKSUM: a5177ec6fb7d15058e99e57029746100121f68e4890b1467d4094aa336b6013e

jobs:
  build:
    name: build fuzz targets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: cache opus DNN model data
        id: opus-dnn-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/opus16-sys/vendor/opus/dnn/*_data.h
            crates/opus16-sys/vendor/opus/dnn/*_data.c
          key: opus-dnn-${{ env.OPUS_MODEL_CHECKSUM }}
      - name: download opus DNN model data
        if: steps.opus-dnn-cache.outputs.cache-hit != 'true'
        working-directory: crates/opus16-sys/vendor/opus
        run: sh dnn/download_model.sh "${{ env.OPUS_MODEL_CHECKSUM }}"
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - run: cargo fuzz build

  fuzz:
    name: fuzz ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - protocol_decode
          - server_control
          - server_auth
          - core_decode
          - text_decrypt
          - audio_receive
          - jitter_buffer
          - identity_backup
          - identity_parse
          - mls_process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: cache opus DNN model data
        id: opus-dnn-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/opus16-sys/vendor/opus/dnn/*_data.h
            crates/opus16-sys/vendor/opus/dnn/*_data.c
          key: opus-dnn-${{ env.OPUS_MODEL_CHECKSUM }}
      - name: download opus DNN model data
        if: steps.opus-dnn-cache.outputs.cache-hit != 'true'
        working-directory: crates/opus16-sys/vendor/opus
        run: sh dnn/download_model.sh "${{ env.OPUS_MODEL_CHECKSUM }}"
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - name: fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_INPUT: ${{ inputs.seconds }}
        run: |
          secs="${SECONDS_INPUT:-60}"
          case "$secs" in
            ''|*[!0-9]*) echo "seconds must be a number" >&2; exit 1 ;;
          esac
          mkdir -p "fuzz/corpus/$TARGET"
          # fuzz/corpus/<target> is the working corpus; fuzz/seeds/<target> is read-only input.
          cargo fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$secs" -max_len=4096 -timeout=20 -rss_limit_mb=4096
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
