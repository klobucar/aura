[workspace]
members = [
    "crates/aura-protocol",
    "crates/aura-server",
    "crates/aura-identity",
    "crates/aura-telemetry",
    "crates/aura-core",
    "crates/opus16-sys",
]
# cargo-fuzz crate: nightly-only, built on its own (see docs/FUZZING.md).
exclude = ["fuzz"]
resolver = "2"

[profile.release]
lto = false

[profile.dev]
lto = false
