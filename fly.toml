# fly.toml app configuration file generated for aura-server on 2026-04-11T20:17:44-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aura-server'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  AURA_ACME_DOMAIN = '<PLACEHOLDER>'
  AURA_ACME_CONTACT = '<PLACEHOLDER>'
  AURA_ACME_BIND_PORT = '8080'
  AURA_ACME_CACHE_PATH = '/data/acme'
  # Fly delivers UDP only to fly-global-services (needs a dedicated IPv4);
  # TCP listeners (ACME HTTP-01, health check) must use 0.0.0.0 instead.
  AURA_BIND_ADDRESS = 'fly-global-services:8443'
  # Fly's UDP path dropped everything sent to a client for about a minute
  # after a packet larger than ~1350 bytes, so the server does not probe.
  AURA_MTU_DISCOVERY = 'false'
  AURA_HTTP_BIND_IP = '0.0.0.0'
  # Prometheus metrics for Fly's managed Grafana (fly-metrics.net). Aggregate
  # counts only; the port is not in [[services]], so only Fly's scraper reaches it.
  AURA_METRICS_ADDR = '[::]:9091'
  # Opt-in tracing: set OTEL_EXPORTER_OTLP_ENDPOINT (and _HEADERS) as Fly
  # secrets, not here; see docs/OBSERVABILITY.md.
  AURA_DATABASE_PATH = '/data/aura.db'
  # Unset = Let's Encrypt production. Uncomment to test against staging:
  # AURA_ACME_DIRECTORY_URL = 'https://acme-staging-v02.api.letsencrypt.org/directory'

[[mounts]]
  source = 'aura_data'
  destination = '/data'

[[services]]
  protocol = 'udp'
  internal_port = 8443
  [[services.ports]]
    port = 8443

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  [[services.ports]]
    port = 80
    handlers = ["http"]
    # force_https = true  # Disabled for ACME HTTP-01 challenges

  [[services.ports]]
    port = 443
    handlers = [] # Raw TCP for internal management if needed

[checks]
  [checks.active]
    port = 8080
    type = 'tcp'
    interval = '30s'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[metrics]
  port = 9091
  path = '/metrics'
